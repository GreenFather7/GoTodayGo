name: GoTodayGo · просмотры за сутки

on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: gotodaygo-view-measurements
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      completed: ${{ steps.report.outputs.completed }}
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Обновить замеры и отчёт
        run: python3 experiment.py
      - name: Сохранить результаты
        id: report
        shell: bash
        run: |
          set -euo pipefail
          git add -- experiment-state.json experiment-report.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update 24-hour Telegram view measurements'
            for attempt in 1 2 3; do
              if git push origin "HEAD:refs/heads/$BRANCH"; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              git fetch origin "$BRANCH"
              git rebase FETCH_HEAD
            done
          fi
          python3 -c 'import json; print("completed=" + str(json.load(open("experiment-state.json"))["completed"]).lower())' >> "$GITHUB_OUTPUT"
          cat experiment-report.md >> "$GITHUB_STEP_SUMMARY"

  finish:
    needs: collect
    if: needs.collect.outputs.completed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Завершить мониторинг после последнего замера
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable measure.yml --repo "$GITHUB_REPOSITORY"
